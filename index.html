<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pembayaran • DANA & QRIS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(145deg, #eef4fb 0%, #dde9f5 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .payment-card {
    max-width: 460px;
    width: 100%;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 2.2rem;
    padding: 1.8rem 1.5rem 2rem;
    box-shadow:
      0 25px 45px -12px rgba(0, 20, 40, 0.25),
      0 8px 18px rgba(0, 0, 0, 0.05),
      inset 0 1px 0 rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.6);
    animation: fadeUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 1.5rem;
  }
  .header-icon {
    background: linear-gradient(135deg, #0b5ed7, #0a4da3);
    width: 42px; height: 42px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 16px -6px rgba(11, 94, 215, 0.45);
  }
  .header-icon svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; }
  .header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(145deg, #0b1e33, #1a344d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .header span {
    font-size: 0.7rem;
    font-weight: 600;
    color: #0a4da3;
    margin-left: auto;
    background: rgba(11, 94, 215, 0.1);
    padding: 0.4rem 0.8rem;
    border-radius: 40px;
    letter-spacing: 0.3px;
  }

  /* TAB SELECTOR */
  .tabs {
    display: flex;
    gap: 0.5rem;
    background: #eaf1f9;
    padding: 0.35rem;
    border-radius: 1.2rem;
    margin-bottom: 1.4rem;
    position: relative;
  }
  .tab {
    flex: 1;
    border: none;
    background: transparent;
    padding: 0.8rem 0.5rem;
    border-radius: 1rem;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.9rem;
    color: #5d7388;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
  }
  .tab svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .tab.active {
    background: #fff;
    color: #0b5ed7;
    box-shadow: 0 6px 14px -6px rgba(11, 94, 215, 0.35);
  }

  /* PANEL */
  .panel { display: none; animation: fadePanel 0.35s ease; }
  .panel.active { display: block; }

  @keyframes fadePanel {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* INFO ROW */
  .info-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    padding: 0.9rem 1.1rem;
    border-radius: 1.4rem;
    margin-bottom: 0.7rem;
    border: 1px solid rgba(11, 94, 215, 0.08);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
  }
  .info-label {
    font-size: 0.8rem;
    font-weight: 500;
    color: #5d7388;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .info-label svg { width: 16px; height: 16px; stroke: #5d7388; fill: none; stroke-width: 1.8; }
  .info-value {
    font-weight: 700;
    font-size: 1rem;
    color: #0b1e33;
    letter-spacing: 0.5px;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .copy-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.4rem;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #6a8aa8;
    transition: all 0.15s ease;
  }
  .copy-btn:hover { background: rgba(11, 94, 215, 0.1); color: #0b5ed7; }
  .copy-btn:active { transform: scale(0.9); }
  .copy-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  /* DANA BRAND */
  .brand-head {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1rem;
  }
  .brand-logo {
    width: 34px; height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #fff;
    font-size: 1rem;
  }
  .brand-logo.dana { background: linear-gradient(135deg, #118ee9, #0a6ebd); }
  .brand-logo.qris { background: linear-gradient(135deg, #e53935, #b71c1c); font-size: 0.7rem; letter-spacing: 0.3px; }
  .brand-head h2 { font-size: 1.05rem; font-weight: 600; color: #1a344d; }
  .brand-head small {
    margin-left: auto;
    font-size: 0.7rem;
    font-weight: 600;
    background: #eef4fa;
    color: #3a5770;
    padding: 0.3rem 0.75rem;
    border-radius: 40px;
  }

  /* QRIS IMAGE */
  .qr-wrap {
    background: #fff;
    border-radius: 1.6rem;
    padding: 1rem;
    border: 1px dashed #b8c9dd;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.02);
  }
  .qr-wrap img {
    width: 100%;
    max-width: 320px;
    border-radius: 1rem;
    display: block;
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .qr-wrap img:active { transform: scale(0.98); }
  .qr-caption {
    font-size: 0.75rem;
    color: #6a8aa8;
    background: #eef4fa;
    padding: 0.35rem 1rem;
    border-radius: 40px;
    margin-top: 0.9rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  .qr-caption svg { width: 12px; height: 12px; stroke: #6a8aa8; fill: none; stroke-width: 2; }

  /* FOOTER NOTE */
  .footer-note {
    text-align: center;
    font-size: 0.72rem;
    color: #7a95af;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    margin-top: 1rem;
  }
  .footer-note svg { width: 13px; height: 13px; stroke: #7a95af; fill: none; stroke-width: 1.8; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) scale(0.9);
    background: #1e2b3c;
    color: #fff;
    padding: 0.7rem 1.3rem;
    border-radius: 60px;
    font-size: 0.85rem;
    font-weight: 500;
    opacity: 0;
    transition: all 0.25s ease;
    pointer-events: none;
    box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.35);
    white-space: nowrap;
    z-index: 999;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }
  .toast svg { width: 16px; height: 16px; stroke: #4ade80; fill: none; stroke-width: 2.5; }

  @media (max-width: 400px) {
    .payment-card { padding: 1.5rem 1.1rem 1.7rem; }
    .header h1 { font-size: 1.3rem; }
    .info-value { font-size: 0.9rem; }
  }
</style>
</head>
<body>
  <div class="payment-card">

    <!-- HEADER -->
    <div class="header">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
      </div>
      <h1>Pembayaran</h1>
      <span>⚡ instan</span>
    </div>

    <!-- TAB SELECTOR -->
    <div class="tabs">
      <button class="tab active" onclick="switchTab('dana', this)">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2"/>
          <line x1="12" y1="18" x2="12.01" y2="18"/>
        </svg>
        DANA
      </button>
      <button class="tab" onclick="switchTab('qris', this)">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        QRIS
      </button>
    </div>

    <!-- PANEL DANA -->
    <div id="panel-dana" class="panel active">
      <div class="brand-head">
        <div class="brand-logo dana">D</div>
        <h2>DANA</h2>
        <small>E-Wallet</small>
      </div>

      <div class="info-row">
        <div class="info-label">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2"/>
            <line x1="12" y1="18" x2="12.01" y2="18"/>
          </svg>
          Nomor
        </div>
        <div style="display:flex;align-items:center;gap:0.3rem;">
          <span class="info-value">081353682082</span>
          <button class="copy-btn" onclick="copyToClipboard('081353682082','Nomor DANA disalin!')" aria-label="Salin nomor DANA">
            <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="info-row">
        <div class="info-label">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          A/N
        </div>
        <span class="info-value" style="letter-spacing:0.8px;">KHOTIJAH</span>
      </div>

      <div class="footer-note">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 16v-4M12 8h.01"/>
        </svg>
        transfer ke nomor DANA di atas • konfirmasi otomatis
      </div>
    </div>

    <!-- PANEL QRIS -->
    <div id="panel-qris" class="panel">
      <div class="brand-head">
        <div class="brand-logo qris">QR</div>
        <h2>QRIS</h2>
        <small>semua bank</small>
      </div>

      <div class="qr-wrap">
        <!-- ⬇️ GANTI src DI BAWAH DENGAN LINK GAMBAR QRIS ANDA ⬇️ -->
        <img src="https://cdn.phototourl.com/member/2026-10-10-76af24b2-87d0-4d80-8eca-2444bc87aad0.jpg" alt="QRIS callzy - NMID ID1025396453249"
             onclick="showToast('Silakan scan QRIS ini 📸')">
        <!-- ⬆️ GANTI src DI ATAS DENGAN LINK GAMBAR QRIS ANDA ⬆️ -->
        <div class="qr-caption">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="2"/>
            <line x1="8" y1="2" x2="8" y2="22"/>
            <line x1="16" y1="2" x2="16" y2="22"/>
          </svg>
          tap untuk scan
        </div>
      </div>

      <div class="footer-note">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 16v-4M12 8h.01"/>
        </svg>
        scan pakai aplikasi apapun • semua bank & e-wallet
      </div>
    </div>

    <div style="display:flex;justify-content:center;margin-top:1.2rem;">
      <div style="font-size:0.68rem;color:#9bb1c7;letter-spacing:0.3px;display:flex;gap:1rem;">
        <span>🔒 aman</span><span>⚡ cepat</span><span>✓ terverifikasi</span>
      </div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span id="toastMessage">Disalin!</span>
  </div>

<script>
  // ====== GANTI TAB ======
  function switchTab(name, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + name).classList.add('active');
  }

  // ====== COPY ======
  function copyToClipboard(text, msg) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => fallback(text, msg));
    } else {
      fallback(text, msg);
    }
  }
  function fallback(text, msg) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast(msg); }
    catch(e) { showToast('Gagal menyalin 😢'); }
    document.body.removeChild(ta);
  }

  // ====== TOAST ======
  let toastTimer;
  function showToast(msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toastMessage').textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }
</script>
</body>
</html>
